model:
  context_length: 128
  d_model: 128
  n_heads: 4
  n_layers: 4
  ffn_dim: 512
  dropout: 0.1
  pos_encoding_type: "sinusoidal" # options: "sinusoidal", "learned"
  tie_weights: false

training:
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.01
  max_steps: 2000
  eval_interval: 200
  eval_iters: 50
  device: "auto" # "cuda", "cpu", or "auto"
  seed: 42
  checkpoint_dir: "checkpoints"
  checkpoint_name: "tiny_gpt_best.pt"

data:
  dataset_name: "tiny_shakespeare"
  data_dir: "data"
  raw_file: "data/input.txt"
  train_split: 0.9

generation:
  max_new_tokens: 150
  temperature: 0.8
  top_k: 40
